[project]
name = "dm-pipeline"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "polars>=1.0",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dm-ingest = "dm_pipeline.ingest.cli:main"
dm-harvest = "dm_pipeline.harvest.daemon:main"
dm-backfill = "dm_pipeline.harvest.backfill:main"
dm-features = "dm_pipeline.features.build_dataset:main"
dm-builds = "dm_pipeline.features.builds:main"
dm-trajectories = "dm_pipeline.features.trajectories:main"
dm-fit-fightscale = "dm_pipeline.calibrate.fightscale:main"
dm-montecarlo = "dm_pipeline.prototype.montecarlo:main"
dm-train-winprob = "dm_pipeline.models.win_probability.train:main"
dm-calibrate = "dm_pipeline.calibrate.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dm_pipeline"]
