[project]
name = "dm-pipeline"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dm-ingest = "dm_pipeline.ingest.cli:main"
dm-harvest = "dm_pipeline.harvest.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dm_pipeline"]
